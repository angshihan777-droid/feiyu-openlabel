# CE (Community Edition) — 仅业务面入口
upstream app_biz_1 {
    server web-api:8423;
}

server {
    listen 80;
    listen [::]:80;

    server_name localhost;
    client_max_body_size 600m;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/v1/b/ {
        rewrite ^/api/v1/b/(.*)$ /$1 break;
        proxy_pass http://app_biz_1;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header access-token $http_access_token;
    }

    # captcha / 邮箱验证码 / 短信验证码(登录前调用,FastAPI 内部 router 保留 /api/v1/c 前缀)
    location /api/v1/c/ {
        proxy_pass http://app_biz_1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # admin 管理面(EE/SaaS 才有 router,CE 无路由会 404 by app——不影响前端静态页)
    location /api/v1/a/ {
        proxy_pass http://app_biz_1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 平台管理面：平台管理员管理租户。CE 也显式提供基础租户开通/删除。
    location /api/v1/p/ {
        proxy_pass http://app_biz_1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录 / 刷新 / 登出 / 重置密码(auth router 已挂 /u/a/noau 前缀,原样转发)
    location /u/ {
        proxy_pass http://app_biz_1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /guis {
        alias /usr/share/nginx/html/feiyu/guis;
        index index.html home.html;
    }

    location / {
        root /usr/share/nginx/html/root;
        index index.html index.htm;
    }
}
